server:
  servlet:
    context-path: /pedido-delivery/api

spring:
  datasource:
    url: jdbc:h2:mem:demodb
    usermane: sa
    password:
      driverClassName: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  spring:
  jackson:
    mapper:
      sort-properties-alphabetically: false

